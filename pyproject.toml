[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fleetpulse"
version = "0.1.0"
description = "Real-Time Fleet and Delivery Intelligence Platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "FleetPulse Team" }]
dependencies = [
    "aiokafka>=0.12.0,<1.0.0",
    "alembic>=1.14.0,<2.0.0",
    "asyncpg>=0.30.0,<1.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "pydantic>=2.9.0,<3.0.0",
    "pydantic-settings>=2.6.0,<3.0.0",
    "redis>=5.2.0,<7.0.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "fakeredis[lua]>=2.26.0,<3.0.0",
    "httpx2>=2.16.0,<3.0.0",
    "mypy>=1.13.0,<2.0.0",
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.24.0,<2.0.0",
    "ruff>=0.7.0,<1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app", "simulator"]
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "simulator", "tests"]
show_error_codes = true
pretty = true

# aiokafka ships no type stubs; the integration module keeps its surface
# narrow (producer/admin start, publish, close) so strict mode stays useful.
[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

# fakeredis is a test-only dependency and does not ship type stubs.
[[tool.mypy.overrides]]
module = ["fakeredis", "fakeredis.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config -m 'not integration and not kafka and not redis'"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requires a running PostgreSQL instance (docker compose up -d postgres)",
    "kafka: requires PostgreSQL and the Kafka broker (docker compose up -d postgres kafka)",
    "redis: requires the Redis service (docker compose up -d redis)",
]
